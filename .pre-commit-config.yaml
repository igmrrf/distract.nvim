# Pre-commit configuration for distract.nvim
# See https://pre-commit.com for more information

default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust Format Check
        entry: cargo fmt --manifest-path engine/Cargo.toml -- --check
        language: system
        files: ^engine/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: Rust Lint (clippy, warnings are errors)
        entry: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
        language: system
        files: ^engine/.*
        pass_filenames: false

      - id: cargo-test
        name: Rust Engine Unit Tests
        entry: cargo test --manifest-path engine/Cargo.toml
        language: system
        files: ^engine/.*
        pass_filenames: false

      - id: stylua
        name: Lua Format Check
        entry: stylua --check lua plugin tests
        language: system
        files: ^(lua/|plugin/|tests/).*\.lua$
        pass_filenames: false

      - id: luacheck
        name: Lua Lint
        entry: luacheck lua plugin tests
        language: system
        files: ^(lua/|plugin/|tests/).*\.lua$
        pass_filenames: false

      # No trailing `-c "q"`: it masks a failing suite and makes the hook pass.
      # run_tests.lua terminates the editor itself via qall!/cquit.
      - id: lua-tests
        name: Neovim Lua Test Suite
        entry: nvim --headless -u tests/minimal_init.lua -c "luafile tests/run_tests.lua"
        language: system
        files: ^(lua/|plugin/|tests/).*\.lua$
        pass_filenames: false
