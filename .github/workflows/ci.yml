name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

# A newer push to the same branch makes the older run's answer irrelevant, and
# leaving it queued starves the runner pool — several were still going an hour
# later. Tag refs are exempt: cancelling a release build half way through
# publishes nothing and leaves the tag looking broken.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # =========================================================================
  # 0. Lint and format gates
  # =========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install Linux GUI/Winit build dependencies
        env:
          # needrestart prompts for which services to restart once a package
          # lands, and a prompt on a runner nobody can answer hangs the job
          # until the six-hour ceiling. apt itself waits forever for a lock the
          # runner's own unattended-upgrades timer may be holding.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # Applied to both commands. Without the Acquire bounds a stalled
          # mirror hangs `apt-get update` indefinitely, which is where the lint
          # and ubuntu test jobs were sitting; DPkg::Lock::Timeout covers only
          # the dpkg frontend lock and does nothing for a network stall.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          APT_OPTS="$APT_OPTS -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: cargo fmt --check
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      # Warnings are errors here: an advisory lint nobody reads is not a gate.
      - name: cargo clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings

      - name: Setup Lua for luacheck
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: luacheck
        run: luacheck lua plugin tests

      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests

  # =========================================================================
  # 1. Neovim Lua Test Suite
  # =========================================================================
  test-lua:
    name: Lua Tests (Neovim)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Setup Plenary test dependency
        run: |
          mkdir -p .tests/site/pack/deps/start
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim .tests/site/pack/deps/start/plenary.nvim

      # No trailing `-c "q"`: it would mask a failing suite and make the job
      # exit 0. run_tests.lua terminates the editor itself via qall!/cquit.
      # run_tests.lua enumerates every spec file, so running
      # PlenaryBustedDirectory over the same directory afterwards only doubled
      # the job time.
      - name: Run Lua test suite
        timeout-minutes: 5
        run: nvim --headless -u tests/minimal_init.lua -c "luafile tests/run_tests.lua"

  # =========================================================================
  # 2. Rust Engine Unit & Integration Tests
  # =========================================================================
  test-rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI/Winit build dependencies
        if: runner.os == 'Linux'
        env:
          # needrestart prompts for which services to restart once a package
          # lands, and a prompt on a runner nobody can answer hangs the job
          # until the six-hour ceiling. apt itself waits forever for a lock the
          # runner's own unattended-upgrades timer may be holding.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # Applied to both commands. Without the Acquire bounds a stalled
          # mirror hangs `apt-get update` indefinitely, which is where the lint
          # and ubuntu test jobs were sitting; DPkg::Lock::Timeout covers only
          # the dpkg frontend lock and does nothing for a network stall.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          APT_OPTS="$APT_OPTS -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Run Cargo Check
        run: cargo check --manifest-path engine/Cargo.toml

      - name: Run Cargo Tests
        run: cargo test --manifest-path engine/Cargo.toml -- --nocapture

  # =========================================================================
  # 3. Cross-Platform Release Builds (Triggered on v* Tag)
  # =========================================================================
  build-engine-release:
    name: Build Binary (${{ matrix.target }})
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test-lua, test-rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: distract-engine-linux-x86_64.tar.gz
            bin_name: distract-engine
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: distract-engine-macos-x86_64.tar.gz
            bin_name: distract-engine
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: distract-engine-macos-aarch64.tar.gz
            bin_name: distract-engine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: distract-engine-windows-x86_64.zip
            bin_name: distract-engine.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        env:
          # needrestart prompts for which services to restart once a package
          # lands, and a prompt on a runner nobody can answer hangs the job
          # until the six-hour ceiling. apt itself waits forever for a lock the
          # runner's own unattended-upgrades timer may be holding.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # Applied to both commands. Without the Acquire bounds a stalled
          # mirror hangs `apt-get update` indefinitely, which is where the lint
          # and ubuntu test jobs were sitting; DPkg::Lock::Timeout covers only
          # the dpkg frontend lock and does nothing for a network stall.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          APT_OPTS="$APT_OPTS -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --manifest-path engine/Cargo.toml

      - name: Package Unix Binary
        if: runner.os != 'Windows'
        run: |
          cd engine/target/${{ matrix.target }}/release
          tar -czvf ../../../../${{ matrix.artifact_name }} ${{ matrix.bin_name }}
          cd ../../../..
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd engine/target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin_name }} -DestinationPath ../../../../${{ matrix.artifact_name }}
          cd ../../../..
          Get-FileHash -Algorithm SHA256 ${{ matrix.artifact_name }} | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii "${{ matrix.artifact_name }}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  # =========================================================================
  # 4. GitHub Release Publish
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-engine-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
